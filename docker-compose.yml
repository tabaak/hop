x-hopd-common: &hopd-common
  image: ghcr.io/tabaak/hopd:latest
  # To build from local source instead, uncomment below:
  # build:
  #   context: .
  #   dockerfile: Dockerfile
  container_name: hopd
  restart: unless-stopped
  environment:
    - DOMAIN=${DOMAIN:-hop.example.com}
    - EMAIL=${EMAIL:-}
    - STAGING=${STAGING:-true}
    - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
    - HOP_TOKENS=${HOP_TOKENS:-}
    - HOP_TLS_CERT=${HOP_TLS_CERT:-}
    - HOP_TLS_KEY=${HOP_TLS_KEY:-}
    - REVERSE_PROXY=${REVERSE_PROXY:-false}
  volumes:
    - hopd-certs:/var/lib/hop/certs
    - hopd-tokens:/etc/hop

services:
  # Standalone mode (default): Claims public ports 80 and 443
  hopd:
    <<: *hopd-common
    profiles: ["standalone"]
    ports:
      - "80:80"
      - "443:443"
      - "7443:7443"

  # Reverse Proxy mode: Runs on 127.0.0.1:8080 behind existing Nginx / Caddy
  hopd-proxy:
    <<: *hopd-common
    profiles: ["proxy"]
    ports:
      - "8080:8080"
      - "7443:7443"
    environment:
      - DOMAIN=${DOMAIN:-hop.example.com}
      - EMAIL=${EMAIL:-}
      - STAGING=${STAGING:-true}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - HOP_TOKENS=${HOP_TOKENS:-}
      - HOP_TLS_CERT=${HOP_TLS_CERT:-}
      - HOP_TLS_KEY=${HOP_TLS_KEY:-}
      - REVERSE_PROXY=true

volumes:
  hopd-certs:
  hopd-tokens:
