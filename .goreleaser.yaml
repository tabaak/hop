# Builds the release binaries and publishes them to a GitHub Release.
# Run by .github/workflows/release.yml on every v* tag. Try it locally with:
#
#   goreleaser release --snapshot --clean
#
# The hopd container image is built separately, by docker.yml.
version: 2

project_name: hop

before:
  hooks:
    - go mod download

builds:
  - id: hop
    main: ./cmd/hop
    binary: hop
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Tag }}

  # The server only runs on Linux VPSes, so there is no macOS build of it.
  - id: hopd
    main: ./cmd/hopd
    binary: hopd
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Tag }}

# One archive per binary per platform. The names carry no version, so
# https://github.com/tabaak/hop/releases/latest/download/hop_darwin_arm64.tar.gz
# always points at the newest release — install.sh and the README rely on that.
archives:
  - id: hop
    ids: [hop]
    formats: [tar.gz]
    name_template: "hop_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
  - id: hopd
    ids: [hopd]
    formats: [tar.gz]
    name_template: "hopd_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - deploy/hopd.service

checksum:
  name_template: checksums.txt

# Publishes a cask for the client to github.com/tabaak/homebrew-tap, so
# `brew install tabaak/tap/hop` works. Pushing to another repo needs a token
# with contents:write on it: the HOMEBREW_TAP_GITHUB_TOKEN secret.
homebrew_casks:
  - name: hop
    ids: [hop]
    repository:
      owner: tabaak
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/tabaak/hop
    description: Self-hosted ngrok alternative with wildcard TLS and a request inspector
    license: MIT
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    # The binary isn't notarized; without this, macOS refuses to run it.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/hop"]
          end

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs"
      - "^chore"
      - "^test"

release:
  github:
    owner: tabaak
    name: hop
  footer: |
    **Server:** `docker pull ghcr.io/tabaak/hopd:{{ .Version }}`, or the `hopd_linux_*` archives above.
