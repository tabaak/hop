x-hopd-common: &hopd-common
  image: ghcr.io/tabaak/hopd:latest
  # To build from local source instead, uncomment below:
  # build:
  #   context: .
  #   dockerfile: Dockerfile
  container_name: hopd
  restart: unless-stopped
  # Everything in .env reaches hopd, so any DNS provider's credentials work
  # without listing them here.
  env_file: .env
  volumes:
    - hopd-certs:/var/lib/hop/certs
    - hopd-tokens:/etc/hop

services:
  # Standalone mode (default): Claims public ports 80 and 443
  hopd:
    <<: *hopd-common
    profiles: ["standalone"]
    ports:
      - "80:80"
      - "443:443"
      - "7443:7443"

  # Reverse Proxy mode: Runs on 127.0.0.1:8080 behind existing Nginx / Caddy
  hopd-proxy:
    <<: *hopd-common
    profiles: ["proxy"]
    ports:
      - "8080:8080"
      - "7443:7443"
    environment:
      - REVERSE_PROXY=true

volumes:
  hopd-certs:
  hopd-tokens:
